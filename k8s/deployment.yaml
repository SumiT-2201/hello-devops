# Kubernetes Deployment manifest for hello-devops
# Defines the desired state for our application pods (container instances)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
  labels:
    app: hello-devops
spec:
  # Desired number of pod replicas running simultaneously for high availability
  replicas: 2
  selector:
    matchLabels:
      app: hello-devops
  template:
    metadata:
      labels:
        app: hello-devops
    spec:
      containers:
      - name: hello-devops
        # Container image built from our Dockerfile
        image: hello-devops:latest
        imagePullPolicy: IfNotPresent
        ports:
        # Nginx in the container listens on port 80
        - containerPort: 80
